<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BovinNet - Registrar animal</title>
    <style>
        body { font-family: Arial, sans-serif; background:#FBF8F3; color:#3E2C1C; padding: 30px; }
        .tarjeta { background:#F0E9DD; max-width: 480px; margin: 0 auto; padding: 24px 28px; border-radius: 10px; }
        h1 { color:#3E2C1C; font-size: 22px; }
        label { display:block; font-weight:bold; margin-top: 14px; margin-bottom: 4px; }
        input, select { width:100%; padding:8px; border-radius:6px; border:1px solid #C9B592; box-sizing:border-box; }
        button { margin-top: 20px; background:#5C7A4B; color:#fff; border:none; padding:10px 18px; border-radius:20px; font-weight:bold; cursor:pointer; }
        .error { background:#FBEDE7; border-left:4px solid #C9613D; padding:10px; margin-top:14px; color:#3E2C1C; }
        nav a { color:#5C7A4B; text-decoration:none; font-weight:bold; }
    </style>
</head>
<body>
<div class="tarjeta">
    <nav><a href="animales">Ver listado de animales</a></nav>
    <h1>Registrar nuevo animal</h1>

    <!-- Formulario HTML que envia los datos al servlet AnimalServlet por metodo POST -->
    <form action="animales" method="post">
        <label for="arete">Numero de arete *</label>
        <input type="text" id="arete" name="arete" maxlength="10" required>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="60">

        <label for="sexo">Sexo *</label>
        <select id="sexo" name="sexo" required>
            <option value="">Seleccione...</option>
            <option value="Hembra">Hembra</option>
            <option value="Macho">Macho</option>
        </select>

        <label for="fechaNacimiento">Fecha de nacimiento *</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>

        <label for="idLote">Id del lote *</label>
        <input type="number" id="idLote" name="idLote" min="1" required>

        <button type="submit">Guardar animal</button>
    </form>
</div>
</body>
</html>
